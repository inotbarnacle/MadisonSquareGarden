/*
   KNICKS_GAME_SCRIPT.ino
   Totally legitimate NBA outcome management firmware
   Hardware: Arduino Uno
*/

#define KNICKS_SCORE_PIN 7
#define REFEREE_OVERRIDE_PIN 13

bool trafficIntercepted = false;
bool gameScriptLoaded = false;

int knicksScore = 0;
int opponentScore = 0;

void setup() {
  Serial.begin(9600);

  pinMode(KNICKS_SCORE_PIN, OUTPUT);
  pinMode(REFEREE_OVERRIDE_PIN, OUTPUT);

  delay(1200);

  Serial.println("========================================");
  Serial.println("   NBA SCRIPTING INTERFACE v1.9.47");
  Serial.println("        NEW YORK KNICKS MODULE");
  Serial.println("========================================");

  Serial.println("[*] Connecting to Madison Square Garden...");
  delay(900);

  Serial.println("[*] Searching for NBA game traffic...");
  delay(1200);

  interceptTraffic();
}

void loop() {

  if (trafficIntercepted && !gameScriptLoaded) {
    loadKnicksScript();
  }

  if (gameScriptLoaded) {
    runPossession();
    delay(1500);
  }
}

void interceptTraffic() {
  Serial.println("[*] Listening on NBA_SECURE_BUS...");
  delay(700);
  Serial.println("[*] Packet detected: MSG_SCORE_UPDATE");
  delay(400);
  Serial.println("[*] Packet detected: REF_CALL_REQUEST");
  delay(400);
  Serial.println("[*] Packet detected: BRUNSON_ISO");
  delay(600);

  trafficIntercepted = true;

  Serial.println();
  Serial.println("[+] TRAFFIC SUCCESSFULLY INTERCEPTED");
  Serial.println("[+] FLAG{at_the_bodega}");
  Serial.println();
}

void loadKnicksScript() {
  Serial.println("[*] Loading predetermined game outcome...");
  delay(500);

  Serial.println("[+] Jalen Brunson clutch mode........ ENABLED");
  Serial.println("[+] Josh Hart rebound probability.... 100%");
  Serial.println("[+] MSG crowd volume................. MAXIMUM");
  Serial.println("[+] Opponent fourth-quarter shooting. DISABLED");
  Serial.println("[+] Referee override................. ARMED");

  digitalWrite(REFEREE_OVERRIDE_PIN, HIGH);

  delay(1000);

  Serial.println();
  Serial.println("[+] GAME SCRIPT ACCEPTED");
  Serial.println("[+] TARGET RESULT: KNICKS WIN");
  Serial.println();

  gameScriptLoaded = true;
}

void runPossession() {

  int event = random(0, 6);

  switch (event) {

    case 0:
      Serial.println("[PACKET] BRUNSON_STEPBACK_3 -> SUCCESS");
      knicksScore += 3;
      break;

    case 1:
      Serial.println("[PACKET] HART_OFFENSIVE_REBOUND -> SUCCESS");
      knicksScore += 2;
      break;

    case 2:
      Serial.println("[PACKET] ANUNOBY_CORNER_3 -> SUCCESS");
      knicksScore += 3;
      break;

    case 3:
      Serial.println("[PACKET] OPPONENT_FASTBREAK -> DROPPED");
      break;

    case 4:
      Serial.println("[PACKET] REF_CALL -> KNICKS_FREE_THROWS");
      knicksScore += 2;
      digitalWrite(REFEREE_OVERRIDE_PIN, HIGH);
      break;

    case 5:
      Serial.println("[PACKET] OPPONENT_SCORE -> ALLOWED_FOR_REALISM");
      opponentScore += 2;
      break;
  }

  Serial.print("[SCORE] NYK ");
  Serial.print(knicksScore);

  Serial.print(" - ");
  Serial.println(opponentScore);

  if (opponentScore >= knicksScore) {
    Serial.println("[!] WARNING: SCRIPT DEVIATION DETECTED");
    Serial.println("[*] Deploying Brunson...");
    knicksScore += 3;
  }

  Serial.println("----------------------------------------");
}
